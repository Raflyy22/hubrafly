<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daftar — Rapzpedia</title>
<link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/auth.css">
</head><body class="auth-page"><main class="auth-shell"><a class="brand auth-brand" href="index.html"><span class="brand-mark">R</span><span>Rapzpedia<span class="brand-muted"> Script</span></span></a>
<section class="auth-card glass"><div class="auth-heading"><div class="eyebrow">CREATE ACCOUNT</div><h1>Buat akun baru</h1><p>Daftar sekali untuk mengakses koleksi script.</p></div>
<form id="registerForm" novalidate>
<label>Username<input id="username" type="text" minlength="3" maxlength="24" placeholder="Username" required></label>
<label>Nomor WhatsApp<input id="whatsapp" type="tel" inputmode="tel" placeholder="628xxxxxxxxxx" required></label>
<label>Email<input id="email" type="email" placeholder="nama@email.com" required></label>
<label>Password<input id="password" type="password" minlength="6" placeholder="Minimal 6 karakter" required></label>
<label>Konfirmasi Password<input id="confirmPassword" type="password" minlength="6" placeholder="Ulangi password" required></label>
<div class="captcha-row"><div><span class="label">Captcha</span><div id="captchaQuestion" class="captcha-box">—</div></div><div><span class="label">Jawaban</span><input id="captchaAnswer" inputmode="numeric" placeholder="Hasil" required></div><button type="button" id="refreshCaptcha" class="icon-btn">↻</button></div>
<div id="formMessage" class="form-message"></div><button class="btn btn-primary btn-block btn-lg" type="submit">Daftar <span>→</span></button>
</form><div class="auth-footer">Sudah punya akun? <a href="login.html">Masuk</a></div></section>
<p class="security-note">Password disimpan sebagai hash Web Crypto pada V1.</p>
</main><script type="module" src="js/core/register-page.js"></script></body></html>
