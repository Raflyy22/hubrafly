<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Rapzpedia PIN Hash</title><body style="font-family:system-ui;max-width:600px;margin:40px auto;padding:20px"><h1>Admin PIN Hash</h1><p>Gunakan hanya untuk menghasilkan SHA-256 hash PIN sebelum memasukkannya ke Firestore Console.</p><input id="pin" inputmode="numeric" placeholder="PIN" style="padding:12px;width:100%;box-sizing:border-box"><button id="go" style="margin-top:12px;padding:12px">Generate</button><pre id="out" style="white-space:pre-wrap;word-break:break-all"></pre><script>go.onclick=async()=>{const b=new TextEncoder().encode(pin.value),h=await crypto.subtle.digest('SHA-256',b);out.textContent=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}</script></body></html>
