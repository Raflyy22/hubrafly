<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin — Rapzpedia</title><link rel="stylesheet" href="../css/reset.css"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/admin.css"></head>
<body data-page="admin"><header class="topbar admin-top"><a class="brand" href="admin.html"><span class="brand-mark">R</span><span>Rapzpedia<span class="brand-muted"> Admin</span></span></a><div class="top-actions"><span class="admin-pill">ADMIN</span><button id="adminLogout" class="btn btn-ghost">Keluar</button></div></header>
<main class="container admin-page"><section class="admin-heading"><div><div class="eyebrow">CONTROL CENTER</div><h1>Dashboard Admin</h1><p>Kelola akun, script, kategori, dan support.</p></div></section>
<div class="admin-tabs"><button class="admin-tab active" data-tab="overview">Overview</button><button class="admin-tab" data-tab="users">Users</button><button class="admin-tab" data-tab="scripts">Scripts</button><button class="admin-tab" data-tab="categories">Categories</button><button class="admin-tab" data-tab="support">Support</button></div>
<section id="adminOverview" class="admin-section"><div id="statsGrid" class="stats-grid"></div><div class="glass panel"><div class="section-title"><h2>Script terbaru</h2><button class="btn btn-primary btn-small" data-jump="scripts">+ Script</button></div><div id="recentScripts" class="admin-list"></div></div></section>
<section id="adminUsers" class="admin-section hidden"><div class="glass panel"><div class="section-title"><h2>Kelola Users</h2><input id="userSearch" class="compact-input" placeholder="Cari user..."></div><div id="usersList" class="admin-list"></div></div></section>
<section id="adminScripts" class="admin-section hidden"><div class="admin-split"><div class="glass panel"><div class="section-title"><h2>Kelola Scripts</h2><button id="newScriptBtn" class="btn btn-primary btn-small">+ Tambah</button></div><div id="scriptsList" class="admin-list"></div></div><div class="glass panel"><h2 id="scriptFormTitle">Tambah Script</h2><form id="scriptForm"><input type="hidden" id="scriptId"><label>Nama Script<input id="scriptName" required></label><label>Game<select id="scriptGame"></select></label><label>Kategori<select id="scriptCategory"></select></label><label>Sub Kategori<select id="scriptSubCategory"></select></label><div class="two-col"><label>Ukuran<input id="scriptSize" placeholder="12 MB"></label><label>Versi<input id="scriptVersion" placeholder="1.0.0"></label></div><label>Deskripsi<textarea id="scriptDescription" rows="5"></textarea></label><hr><h3>Free Download</h3><label>Nama tombol<input id="freeName" placeholder="Download Free"></label><label>URL<input id="freeUrl" type="url"></label><h3>VIP Download</h3><label>Nama tombol<input id="vipName" placeholder="Download VIP"></label><label>URL<input id="vipUrl" type="url"></label><div id="scriptFormMessage" class="form-message"></div><div class="form-actions"><button type="button" id="cancelScript" class="btn btn-ghost">Batal</button><button class="btn btn-primary">Simpan</button></div></form></div></div></section>
<section id="adminCategories" class="admin-section hidden"><div class="admin-split"><div class="glass panel"><h2>Games & Kategori</h2><form id="gameForm" class="inline-form"><input id="gameName" placeholder="Nama game" required><input id="gameIcon" placeholder="Icon" maxlength="3"><button class="btn btn-primary">Tambah Game</button></form><div id="gamesList" class="admin-list"></div></div><div class="glass panel"><h2>Tambah Kategori</h2><form id="categoryForm"><label>Game<select id="categoryGame"></select></label><label>Nama kategori<input id="categoryName" required></label><label>Subkategori <small class="muted">pisahkan dengan koma</small><input id="subCategoryNames" placeholder="Aim Assist, Headshot"></label><button class="btn btn-primary">Simpan Kategori</button></form></div></div></section>
<section id="adminSupport" class="admin-section hidden"><div class="glass panel"><div class="section-title"><h2>Support</h2><span class="muted">Mode LocalStorage: antar tab browser dapat disimulasikan.</span></div><div id="supportThreads" class="admin-list"></div><div id="adminChat" class="admin-chat hidden"><div id="adminMessages" class="messages"></div><form id="adminChatForm" class="chat-input"><input id="adminMessage" placeholder="Balas user..."><button class="send-btn">➤</button></form></div></div></section>
</main><div id="toastContainer" class="toast-container"></div><script type="module" src="../js/admin/admin-page.js"></script></body></html>
