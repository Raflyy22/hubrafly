<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Profile — Rapzpedia</title><link rel="stylesheet" href="../css/reset.css"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/profile.css"></head>
<body data-page="profile"><header class="topbar"><a class="brand" href="user.html"><span class="brand-mark">R</span><span>Rapzpedia<span class="brand-muted"> Script</span></span></a><button id="logoutBtn" class="btn btn-ghost">Keluar</button></header>
<main class="container profile-page"><div class="page-back"><a href="user.html">← Kembali</a></div><section class="profile-hero glass"><div class="avatar" id="avatar">R</div><div><div class="eyebrow">MY PROFILE</div><h1 id="profileUsername">Username</h1><p id="profileVip">Akun aktif</p></div></section>
<div class="profile-grid"><section class="glass panel"><div class="section-title"><h2>Data akun</h2></div><div class="data-list"><div><span>Username</span><b id="dataUsername">-</b></div><div><span>WhatsApp</span><b id="dataWhatsapp">-</b></div><div><span>Email</span><b id="dataEmail">-</b></div><div><span>Status</span><b id="dataStatus">-</b></div></div></section>
<section class="glass panel"><div class="section-title"><h2>Ganti password</h2></div><form id="passwordForm"><label>Password lama<input id="oldPassword" type="password" required></label><label>Password baru<input id="newPassword" type="password" minlength="6" required></label><label>Konfirmasi password baru<input id="newPassword2" type="password" minlength="6" required></label><div id="passwordMessage" class="form-message"></div><button class="btn btn-primary btn-block">Simpan password</button></form></section></div>
<section class="glass danger-panel"><div><h2>Lupa password?</h2><p class="muted">Hubungi support untuk proses pemulihan akun.</p></div><button id="forgotPassword" class="btn btn-danger">Buka Support</button></section></main>
